<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Automation — TrioVision</title>
<style>
    :root {
        --bg-primary: #0a0c0f;
        --bg-secondary: #12161b;
        --bg-card: #161b21;
        --border: #232a33;
        --text-primary: #e8edf3;
        --text-muted: #8592a3;
        --accent: #38bdf8;
        --success: #22c55e;
        --danger: #ef4444;
        --warn: #f59e0b;
        --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
    }
    code, pre, textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .topbar {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 14px 20px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 800; letter-spacing: 3px; font-size: 15px; }
    .brand span { color: var(--accent); letter-spacing: 1px; font-weight: 600; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions a { color: var(--accent); text-decoration: none; font-size: 13px; }

    .chip {
        display: inline-block; padding: 3px 9px; border-radius: 999px;
        font-size: 11px; font-weight: 700; letter-spacing: .3px;
        background: rgba(255,255,255,.06); color: var(--text-muted);
        border: 1px solid var(--border); white-space: nowrap;
    }
    .chip.ok { color: var(--success); border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.08); }
    .chip.bad { color: var(--danger); border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
    .chip.warn { color: var(--warn); border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.08); }
    .chip.off { color: var(--text-muted); }

    .notice {
        margin: 12px 20px 0; padding: 12px 16px; border-radius: var(--radius);
        border: 1px solid var(--border); background: var(--bg-card); line-height: 1.5;
    }
    .notice.ok { border-color: rgba(34,197,94,.35); }
    .notice.bad { border-color: rgba(239,68,68,.45); color: #ffd7d7; }
    .notice code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px; }

    .layout { flex: 1; display: flex; min-height: 0; }

    .sidebar {
        width: 300px; flex-shrink: 0; overflow-y: auto;
        border-right: 1px solid var(--border);
        background: var(--bg-secondary);
        padding: 12px;
        display: flex; flex-direction: column; gap: 8px;
    }
    .wf {
        display: flex; flex-direction: column; gap: 6px; text-align: left;
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 10px 12px;
        color: var(--text-primary); cursor: pointer; font: inherit;
    }
    .wf:hover { border-color: #2f3945; }
    .wf.active { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(56,189,248,.35) inset; }
    .wf-name { font-weight: 700; }
    .wf-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .main { flex: 1; overflow-y: auto; padding: 20px 24px 60px; min-width: 0; }
    .main-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .main-head h1 { margin: 0 0 4px; font-size: 22px; }
    .subtle { color: var(--text-muted); font-size: 12px; }

    .tabs { display: flex; gap: 4px; margin: 18px 0 14px; border-bottom: 1px solid var(--border); }
    .tab {
        background: none; border: none; border-bottom: 2px solid transparent;
        color: var(--text-muted); padding: 8px 14px; cursor: pointer; font: inherit; font-weight: 600;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .field { display: block; margin-bottom: 14px; }
    .field span { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 12px; }
    .field input, .field textarea {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        background: var(--bg-card); color: var(--text-primary);
        border: 1px solid var(--border); font-size: 13px; outline: none;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { line-height: 1.5; resize: vertical; }

    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }

    .btn {
        background: var(--bg-card); color: var(--text-primary);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn:hover { border-color: #2f3945; }
    .btn.primary { background: var(--accent); color: #06121a; border-color: var(--accent); }
    .btn.danger { color: var(--danger); border-color: rgba(239,68,68,.4); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .link { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; margin-left: 8px; }

    .plan {
        background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 16px; line-height: 1.9; white-space: pre-wrap; font-size: 13px;
    }
    .warn { margin-top: 12px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid rgba(245,158,11,.35); background: rgba(245,158,11,.06); }
    .warn ul { margin: 8px 0 0 18px; }

    table.runs { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    table.runs th { text-align: left; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 8px; border-bottom: 1px solid var(--border); }
    table.runs td { padding: 9px 8px; border-bottom: 1px solid rgba(35,42,51,.6); vertical-align: top; }
    .run-row { cursor: pointer; }
    .run-row:hover td { background: rgba(56,189,248,.04); }
    .ellipsis { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty { color: var(--text-muted); padding: 18px 0; }
    .empty-state { padding: 40px 0; max-width: 520px; }
    .empty-state h2 { margin: 0 0 8px; }

    @media (max-width: 820px) {
        .layout { flex-direction: column; }
        .sidebar { width: 100%; max-height: 220px; border-right: none; border-bottom: 1px solid var(--border); }
        .main { padding: 16px; }
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="brand">TRIO<span>VISION</span> <span>· automation</span></div>
    <div id="health" class="chips"></div>
    <div class="actions">
        <a href="admin.html">← Admin</a>
        <button id="createBtn" class="btn primary">+ New workflow</button>
        <button id="refreshBtn" class="btn" title="Reload">↻</button>
    </div>
</header>

<div id="notice" class="notice" hidden></div>

<div class="layout">
    <aside id="workflowList" class="sidebar">
        <p class="empty">Loading…</p>
    </aside>
    <main id="main" class="main">
        <p class="empty">Loading…</p>
    </main>
</div>

<noscript><p style="padding:20px">This page needs JavaScript.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="automation/js/app.js"></script>
</body>
</html>
