<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrioVision — Admin Orders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #0a0c0f; color: #fff; min-height: 100vh; }

        .top-bar {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            border-bottom: 1px solid #38bdf8;
            padding: 14px 5%;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        .top-bar h1 { font-size: 20px; font-weight: 900; }
        .top-bar h1 span { color: #38bdf8; }
        .top-bar-right { display: flex; align-items: center; gap: 12px; }
        .badge-pill { background: #38bdf8; color: #0f172a; font-weight: 900; font-size: 11px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .refresh-btn { background: #334155; color: white; border: 1px solid #475569; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .refresh-btn:hover { background: #475569; }
        .stats { padding: 20px 5%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .stat-card { background: #121519; border: 1px solid #252b31; border-radius: 12px; padding: 20px; text-align: center; }
        .stat-card .number { font-size: 28px; font-weight: 900; color: #38bdf8; }
        .stat-card .label { font-size: 12px; color: #777f88; margin-top: 4px; }
        .filters { padding: 10px 5% 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .search-input { padding: 10px 14px; background: #15191e; border: 1px solid #2d333a; border-radius: 8px; color: white; font-size: 13px; outline: none; width: 260px; }
        .search-input:focus { border-color: #555e69; }
        .filter-btn { padding: 9px 16px; border: 1px solid #292f35; background: #15191e; color: #858c94; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .filter-btn.active, .filter-btn:hover { background: white; color: #111; border-color: white; }

        .orders-container { padding: 0 5% 50px; }
        .order-table { width: 100%; border-collapse: collapse; }
        .order-table th { text-align: left; padding: 12px 14px; background: #15191e; border-bottom: 2px solid #252b31; font-size: 11px; text-transform: uppercase; color: #777f88; letter-spacing: 0.5px; }
        .order-table td { padding: 14px; border-bottom: 1px solid #1e2228; font-size: 13px; vertical-align: top; }
        .order-table tr:hover { background: #121519; }
        .order-code { color: #7dd3fc; font-weight: bold; font-family: monospace; font-size: 13px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .status-confirmed { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-shipped { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
        .status-delivered { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }
        .items-list { max-width: 300px; }
        .items-list li { margin-bottom: 3px; list-style: none; font-size: 12px; color: #a0a8b2; }
        .total-price { font-weight: bold; color: #22c55e; font-size: 14px; }
        .action-btn { padding: 5px 10px; border-radius: 6px; border: 1px solid #343a41; background: #181c21; color: white; font-size: 11px; cursor: pointer; margin-right: 4px; }
        .action-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .empty-state { text-align: center; padding: 80px 20px; color: #777f87; }
        .empty-state h3 { color: white; margin-bottom: 8px; }
        .loading { text-align: center; padding: 60px; color: #777f87; }

        .modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; visibility: hidden; transition: .3s; }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-box { width: min(600px, 100%); max-height: 85vh; overflow-y: auto; background: #111519; border: 1px solid #30363d; border-radius: 16px; padding: 30px; }
        .modal-box h2 { font-size: 22px; margin-bottom: 15px; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e2228; font-size: 13px; }
        .detail-row .label { color: #777f88; }
        .detail-row .value { color: white; font-weight: bold; }
        .detail-items { margin: 15px 0; padding: 15px; background: #0d1013; border-radius: 10px; }
        .detail-items li { list-style: none; padding: 6px 0; border-bottom: 1px solid #1e2228; font-size: 13px; }
        .detail-images { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .detail-images img { width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid #30363d; }

        @media(max-width: 900px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .order-table { font-size: 11px; }
            .order-table th, .order-table td { padding: 10px 8px; }
        }
        @media(max-width: 600px) {
            .stats { grid-template-columns: 1fr; }
            .filters { flex-direction: column; }
            .search-input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>TrioVision <span>Admin</span></h1>
        <div class="top-bar-right">
            <span class="badge-pill">Orders Dashboard</span>
            <button class="refresh-btn" onclick="loadOrders()">↻ Refresh</button>
            <a href="index.html" style="color:#38bdf8; font-size:13px; font-weight:bold;">← Back to Store</a>
        </div>
    </div>

    <div class="stats" id="statsBar">
        <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">Total Orders</div></div>
        <div class="stat-card"><div class="number" id="statRevenue">0 DA</div><div class="label">Total Revenue</div></div>
        <div class="stat-card"><div class="number" id="statPending">0</div><div class="label">Pending</div></div>
        <div class="stat-card"><div class="number" id="statToday">0</div><div class="label">Today's Orders</div></div>
    </div>

    <div class="filters">
        <input class="search-input" id="searchInput" type="text" placeholder="Search by name, phone, code..." oninput="filterOrders()">
        <button class="filter-btn active" onclick="setStatusFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setStatusFilter('pending', this)">Pending</button>
        <button class="filter-btn" onclick="setStatusFilter('confirmed', this)">Confirmed</button>
        <button class="filter-btn" onclick="setStatusFilter('shipped', this)">Shipped</button>
        <button class="filter-btn" onclick="setStatusFilter('delivered', this)">Delivered</button>
    </div>

    <div class="orders-container">
        <div class="loading" id="loadingState">Loading orders...</div>
        <table class="order-table" id="orderTable" style="display:none;">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Location</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">
            <h3>No orders found</h3>
            <p>Orders will appear here when customers place them.</p>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-overlay" id="detailModal" onclick="closeDetailIfOutside(event)">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="detailTitle">Order Details</h2>
                <button onclick="closeDetailModal()" style="background:#181c21; border:1px solid #343a41; color:white; width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:16px;">✕</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════
        // SUPABASE — no CDN, uses fetch()
        // ═══════════════════════════════════════════════════════
        const SUPABASE_URL = "https://netjmoxaleyxgshqvggx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldGptb3hhbGV5eGdzaHF2Z2d4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTkzMTUsImV4cCI6MjEwMjgzNTMxNX0.iZU_LOUqkg4dCqmXcLW9DgXFtl87KiM8l8Io2buUaVY";

        function supabaseHeaders() {
            return {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                "Content-Type": "application/json"
            };
        }

        let allOrders = [];
        let currentStatusFilter = "all";

        async function loadOrders() {
            document.getElementById("loadingState").style.display = "block";
            document.getElementById("orderTable").style.display = "none";
            document.getElementById("emptyState").style.display = "none";

            try {
                const resp = await fetch(SUPABASE_URL + "/rest/v1/orders?select=*&order=created_at.desc", {
                    headers: supabaseHeaders()
                });
                if (!resp.ok) throw new Error(resp.status + " " + await resp.text());
                allOrders = await resp.json();
            } catch (error) {
                console.error("Error loading orders:", error);
                document.getElementById("loadingState").innerHTML = "❌ Failed to load orders. Check your Supabase credentials.";
                return;
            }

            updateStats();
            renderOrders();
        }

        function updateStats() {
            const total = allOrders.length;
            const revenue = allOrders.reduce((s, o) => s + o.total, 0);
            const pending = allOrders.filter(o => o.status === "pending").length;
            const today = new Date().toDateString();
            const todayCount = allOrders.filter(o => new Date(o.created_at).toDateString() === today).length;

            document.getElementById("statTotal").textContent = total;
            document.getElementById("statRevenue").textContent = Number(revenue).toLocaleString("fr-DZ") + " DA";
            document.getElementById("statPending").textContent = pending;
            document.getElementById("statToday").textContent = todayCount;
        }

        function renderOrders() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            let filtered = allOrders.filter(o => {
                const matchStatus = currentStatusFilter === "all" || o.status === currentStatusFilter;
                const matchSearch = !search ||
                    o.customer_name.toLowerCase().includes(search) ||
                    o.phone.includes(search) ||
                    o.order_code.toLowerCase().includes(search) ||
                    o.wilaya.toLowerCase().includes(search);
                return matchStatus && matchSearch;
            });

            const tbody = document.getElementById("orderTableBody");
            const loading = document.getElementById("loadingState");
            const table = document.getElementById("orderTable");
            const empty = document.getElementById("emptyState");

            loading.style.display = "none";

            if (filtered.length === 0) {
                table.style.display = "none";
                empty.style.display = "block";
                return;
            }

            table.style.display = "table";
            empty.style.display = "none";

            tbody.innerHTML = filtered.map(o => {
                const items = (o.items || []).map(i => `<li>${i.name} (${i.size}) ×${i.quantity}</li>`).join("");
                const date = new Date(o.created_at).toLocaleDateString("fr-DZ", { day: "2-digit", month: "short", year: "numeric" });
                const time = new Date(o.created_at).toLocaleTimeString("fr-DZ", { hour: "2-digit", minute: "2-digit" });
                return `<tr>
                    <td><span class="order-code">${o.order_code}</span></td>
                    <td>${o.customer_name}</td>
                    <td>${o.phone}</td>
                    <td>${o.wilaya}<br><small style="color:#777">${o.city}</small></td>
                    <td><ul class="items-list">${items}</ul></td>
                    <td><span class="total-price">${Number(o.total).toLocaleString("fr-DZ")} DA</span></td>
                    <td><span class="status-badge status-${o.status}">${o.status}</span></td>
                    <td><small>${date}<br>${time}</small></td>
                    <td>
                        <button class="action-btn" onclick="viewOrder('${o.id}')">👁 View</button>
                        <button class="action-btn" onclick="cycleStatus('${o.id}', '${o.status}')">↻ Status</button>
                    </td>
                </tr>`;
            }).join("");
        }

        function filterOrders() { renderOrders(); }

        function setStatusFilter(status, btn) {
            currentStatusFilter = status;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderOrders();
        }

        async function cycleStatus(orderId, current) {
            const cycle = { pending: "confirmed", confirmed: "shipped", shipped: "delivered", delivered: "pending" };
            const next = cycle[current] || "pending";
            try {
                const resp = await fetch(SUPABASE_URL + "/rest/v1/orders?id=eq." + encodeURIComponent(orderId), {
                    method: "PATCH",
                    headers: Object.assign({}, supabaseHeaders(), { "Prefer": "return=minimal" }),
                    body: JSON.stringify({ status: next })
                });
                if (!resp.ok) throw new Error(await resp.text());
                const order = allOrders.find(o => o.id === orderId);
                if (order) order.status = next;
                updateStats();
                renderOrders();
                showToast("Status → " + next);
            } catch (error) {
                console.error(error);
            }
        }

        function viewOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            document.getElementById("detailTitle").textContent = `Order ${order.order_code}`;

            const items = (order.items || []).map(i =>
                `<li><strong>${i.name}</strong> — ${i.size} × ${i.quantity} — ${Number(i.price * i.quantity).toLocaleString("fr-DZ")} DA</li>`
            ).join("");

            const images = (order.image_urls || []).map(url =>
                `<img src="${url}" alt="Order image">`
            ).join("");

            const date = new Date(order.created_at).toLocaleString("fr-DZ");

            document.getElementById("detailContent").innerHTML = `
                <div class="detail-row"><span class="label">Status</span><span class="value"><span class="status-badge status-${order.status}">${order.status}</span></span></div>
                <div class="detail-row"><span class="label">Date</span><span class="value">${date}</span></div>
                <div class="detail-row"><span class="label">Customer</span><span class="value">${order.customer_name}</span></div>
                <div class="detail-row"><span class="label">Phone</span><span class="value">${order.phone}</span></div>
                <div class="detail-row"><span class="label">Wilaya</span><span class="value">${order.wilaya}</span></div>
                <div class="detail-row"><span class="label">City</span><span class="value">${order.city}</span></div>
                <div class="detail-row"><span class="label">Address</span><span class="value">${order.address}</span></div>
                <div class="detail-row"><span class="label">Notes</span><span class="value">${order.notes || "—"}</span></div>
                <div class="detail-items"><strong>Items</strong><ul style="margin-top:8px;">${items}</ul></div>
                <div class="detail-row"><span class="label">Subtotal</span><span class="value">${Number(order.subtotal).toLocaleString("fr-DZ")} DA</span></div>
                <div class="detail-row"><span class="label">Shipping</span><span class="value">${Number(order.shipping).toLocaleString("fr-DZ")} DA</span></div>
                <div class="detail-row" style="border-top:2px solid #252b31; padding-top:14px;"><span class="label" style="font-size:16px;">Total</span><span class="value" style="font-size:18px; color:#22c55e;">${Number(order.total).toLocaleString("fr-DZ")} DA</span></div>
                ${images ? `<div style="margin-top:15px;"><strong>Images</strong><div class="detail-images">${images}</div></div>` : ""}
            `;

            document.getElementById("detailModal").classList.add("open");
        }

        function closeDetailModal() {
            document.getElementById("detailModal").classList.remove("open");
        }

        function closeDetailIfOutside(e) {
            if (e.target.id === "detailModal") closeDetailModal();
        }

        function showToast(msg) {
            const toast = document.createElement("div");
            toast.textContent = msg;
            toast.style.cssText = "position:fixed;right:25px;bottom:25px;z-index:200;background:white;color:#111;padding:12px 18px;border-radius:8px;font-weight:bold;font-size:13px;box-shadow:0 8px 25px rgba(0,0,0,.4);transition:opacity .3s;";
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = "0"; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        // Load on page ready
        loadOrders();

        // Auto-refresh every 30 seconds
        setInterval(loadOrders, 30000);
    </script>
</body>
</html>
